name: Install prepared whitelist pack

on:
  push:
    paths:
      - '.github/workflows/install-prepared-whitelist.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write and validate prepared JSON
        shell: python
        env:
          PACK_B64_GZ: ""
        run: |
          import base64
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path

          raw = gzip.decompress(base64.b64decode(os.environ["PACK_B64_GZ"]))
          expected_sha256 = "ced65ea2fc032734581903eef563273dc42650eb95f96207b8a95a82ff6c66c5"
          if hashlib.sha256(raw).hexdigest() != expected_sha256:
              raise SystemExit("Prepared JSON checksum mismatch")

          configs = json.loads(raw.decode("utf-8"))
          expected_names = [
              "🇪🇺 🚀Авто | Лучший сервер ⚡⚡",
              "⬇️ Обходы белых списков ⬇️",
              "🇳🇱⚪Нидерланды (БС-2) ☁️",
              "🇭🇺⚪Венгрия (БС-0) ☁️",
              "🇫🇮⚪Финляндия (БС-4) ☁️",
              "🇭🇺🛜Венгрия (БС-1) 📡",
              "🇳🇱⚪Нидерланды (БС-3) ☁️",
          ]
          if [cfg.get("remarks") for cfg in configs] != expected_names:
              raise SystemExit("Unexpected configuration list")

          direct_lists = []
          for cfg in configs:
              if "Обходы белых списков" in str(cfg.get("remarks", "")):
                  continue
              rules = cfg.get("routing", {}).get("rules", [])
              matches = [
                  rule.get("domain")
                  for rule in rules
                  if rule.get("outboundTag") == "direct"
                  and isinstance(rule.get("domain"), list)
                  and rule.get("domain")
              ]
              if len(matches) != 1:
                  raise SystemExit(f"Direct list check failed for {cfg.get('remarks')}")
              direct_lists.append(matches[0])

          if len(direct_lists) != 6 or any(x != direct_lists[0] for x in direct_lists[1:]):
              raise SystemExit("Direct lists are not synchronized across six configs")

          Path("whitelist_configs_combined.json").write_text(
              json.dumps(configs, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

      - name: Commit prepared subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whitelist_configs_combined.json
          git diff --cached --quiet && exit 0
          git commit -m "Install prepared whitelist configs and direct list [skip ci]"
          git push
