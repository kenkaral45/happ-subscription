name: Update subscription

on:
  schedule:
    # Run once per hour, away from GitHub's busy top-of-hour window.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: subscription-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh subscription catalog
        run: python scripts/refresh_subscription.py

      - name: Commit and push changes
        run: |
          if git diff --quiet -- whitelist_configs_combined.json; then
            echo "No subscription changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whitelist_configs_combined.json
          git commit -m "Replace catalog with site subscription"
          git push
